<script>
  const PASS = "dev123";

  while (true) {
    const input = prompt("🔐 Website under development. Enter dev password to continue:");

    if (input === PASS) break;

    document.documentElement.innerHTML = "<h1>Access denied</h1>";
    throw new Error("Blocked");
  }
</script>
