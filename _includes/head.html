<script>
  const PASS = "dev123";

  let input;
  while (input !== PASS) {
    input = prompt("🔐 Enter password to continue:");

    if (input === null || input !== PASS) {
      document.body.innerHTML = "<h1>Access denied</h1>";
      throw new Error("Blocked");
    }
  }
</script>
